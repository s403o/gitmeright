name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A test job needs nothing but read access.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: ShellCheck
        # Warnings are errors. The codebase started clean and it will never be
        # cheaper to keep it that way. ShellCheck alone would have caught three
        # of the defects in the pre-2.0 script (unquoted expansions, `read`
        # without -r, and the `eval` misuse).
        run: shellcheck --severity=style --shell=bash bin/gitmeright install.sh

  test:
    # macOS is not decoration. The pre-2.0 script used GNU-only `sed -i`, so its
    # identity substitution silently did nothing on macOS while still printing
    # "Setup complete" — and CI never saw it because the matrix was Ubuntu only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, macos-latest, macos-14]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install bats
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install bats-core
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq bats
          fi

      - name: Record versions
        run: |
          bash --version | head -1
          git --version
          bats --version

      - name: Run the suite
        # Every test builds a throwaway $HOME and asserts on what `git config`
        # actually resolves in a fixture repo. No test greps a generated file.
        run: bats --print-output-on-failure test/

  # An end-to-end check that the published install path works on a clean box.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install from the repo checkout
        run: GITMERIGHT_SOURCE="$PWD/bin/gitmeright" ./install.sh

      - name: The installed binary works
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          gitmeright --version
          gitmeright list
          gitmeright add ci --name "CI User" --email ci@example.com \
            --host github.com --org acme --no-key --yes --non-interactive

      - name: It resolves the identity it promised
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          git init -q /tmp/fixture
          git -C /tmp/fixture remote add origin git@github.com:acme/api.git
          got=$(git -C /tmp/fixture config user.email)
          [ "$got" = "ci@example.com" ] || { echo "resolved '$got', expected ci@example.com"; exit 1; }
          echo "resolved correctly: $got"

      - name: Uninstall leaves no trace
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          gitmeright uninstall --yes
          ! grep -q gitmeright "$HOME/.gitconfig" 2>/dev/null
